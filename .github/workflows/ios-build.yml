name: MozChatAPP (Build simples sem assinatura)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verificar versão do Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Remover exigência de Development Team
        run: |
          # Remove a necessidade de Team ID
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/"DEVELOPMENT_TEAM\[sdk=iphoneos\*\]" = .*;/"DEVELOPMENT_TEAM[sdk=iphoneos*]" = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS (sem assinar)
        run: flutter build ios --release --no-codesign

      - name: Criar arquivo IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../Runner.ipa Payload
          ls -la ../Runner.ipa

      - name: Upload do IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/Runner.ipa