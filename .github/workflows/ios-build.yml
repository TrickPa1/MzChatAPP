name: Build iOS (Sem Assinatura)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verificar versão do Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar arquivos do Xcode (sem build)
        run: flutter build ios --release --no-codesign --config-only

      - name: Build com xcodebuild (forçando sem assinatura)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Criar IPA a partir do archive
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/
          cd build/ios
          zip -r Runner.ipa Payload
          ls -la Runner.ipa

      - name: Upload do IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/Runner.ipa